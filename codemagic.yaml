workflows:
  board-master-web:
    name: Board Master Web
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Build Web
        script: |
          flutter build web --release \
            --base-href=/board_master/ \
            --build-name=1.0.0 \
            --build-number=1
    artifacts:
      - build/web
    publishing:
      email:
        recipients:
          - 1002800463@qq.com
