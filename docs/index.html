<!DOCTYPE html>
<html>
<head>
  <base href="/board_master/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Board Master - Play Go, Chess, and Gomoku online">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="board_master">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Board Master</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      background: #F5F0E8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .loading {
      text-align: center;
      color: #5C3A28;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #DDD0C0;
      border-top-color: #5C3A28;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-size: 18px;
      font-weight: 600;
    }
    .loading-sub {
      font-size: 13px;
      color: #8B7355;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Board Master</div>
    <div class="loading-sub">Loading...</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
